name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PySide6 requests python-vlc pyinstaller pyinstaller-hooks-contrib Pillow

      - name: Build
        run: .\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/MacPlayer-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: brew install vlc create-dmg

      - name: Install Python dependencies
        run: pip install PySide6 requests python-vlc pyinstaller pyinstaller-hooks-contrib Pillow

      - name: Build
        run: chmod +x build.sh && ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MacPlayer.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows-zip/MacPlayer-windows.zip
            macos-dmg/MacPlayer.dmg
